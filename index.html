<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>iPAS AI 應用規劃師 · 刷題室</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#E30613; --red-d:#8f0409; --bg:#0a0a0c; --panel:#15151a; --panel2:#1c1c23;
  --line:#2a2a33; --txt:#e8e8ec; --dim:#8b8b96; --ok:#28c76f; --warn:#ffb020;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;}
body{
  background-image:
    linear-gradient(rgba(227,6,19,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(227,6,19,.05) 1px,transparent 1px);
  background-size:44px 44px;
  min-height:100vh;padding-bottom:40px;
}
.wrap{max-width:520px;margin:0 auto;padding:14px 14px 0}
.mono{font-family:"Chakra Petch",monospace}

/* ---- header ---- */
.hd{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0a0a0c 70%,rgba(10,10,12,0));padding-top:10px}
.hd-in{border:1px solid var(--line);background:var(--panel);padding:12px 14px;position:relative}
.hd-in:before,.hd-in:after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--red)}
.hd-in:before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.hd-in:after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.tt{font-size:17px;font-weight:700;letter-spacing:.5px}
.tt span{color:var(--red)}
.sub{font-size:11px;color:var(--dim);letter-spacing:2px;margin-top:2px}
.chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chip{font-size:11px;border:1px solid var(--line);padding:4px 9px;color:var(--dim);background:#101014}
.chip b{color:var(--red);font-family:"Chakra Petch";font-size:14px;margin:0 2px}
.chip.g b{color:var(--ok)}

/* ---- generic ---- */
.card{border:1px solid var(--line);background:var(--panel);padding:16px;margin-top:12px}
.lbl{font-size:11px;color:var(--dim);letter-spacing:3px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.lbl:after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1px solid var(--line);background:#101014;padding:11px 8px;text-align:center;font-size:13px;cursor:pointer;transition:.15s;user-select:none}
.opt:active{transform:scale(.97)}
.opt.on{border-color:var(--red);background:rgba(227,6,19,.12);color:#fff;box-shadow:inset 0 0 18px rgba(227,6,19,.15)}
.opt small{display:block;color:var(--dim);font-size:10px;margin-top:2px}
.opt.on small{color:#e08}

.btn{display:block;width:100%;border:0;background:var(--red);color:#fff;font-family:"Chakra Petch","Noto Sans TC";
  font-weight:700;font-size:15px;letter-spacing:2px;padding:15px;margin-top:14px;cursor:pointer;
  transform:skewX(-12deg);position:relative}
.btn span{display:block;transform:skewX(12deg)}
.btn:active{filter:brightness(1.2)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
.btn.sm{padding:11px;font-size:13px}
.row{display:flex;gap:8px}
.row .btn{margin-top:10px}

/* ---- quiz ---- */
.bar{display:flex;gap:2px;margin:10px 0 4px}
.seg{flex:1;height:5px;background:#22222a}
.seg.done{background:var(--red)}
.seg.right{background:var(--ok)}
.seg.wrong{background:var(--warn)}
.seg.now{background:#fff}
.qmeta{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);letter-spacing:1px}
.qmeta .cat{color:var(--red);border:1px solid rgba(227,6,19,.4);padding:1px 7px}
.q{font-size:16px;line-height:1.7;margin:14px 0 16px;font-weight:500}
.ans{border:1px solid var(--line);background:#101014;padding:13px 14px;margin-bottom:9px;display:flex;gap:11px;
  cursor:pointer;align-items:flex-start;line-height:1.6;font-size:14px;transition:.12s}
.ans .k{font-family:"Chakra Petch";font-weight:700;color:var(--dim);flex:0 0 18px}
.ans:active{border-color:#555}
.ans.pick{border-color:var(--red);background:rgba(227,6,19,.1)}
.ans.pick .k{color:var(--red)}
.ans.good{border-color:var(--ok);background:rgba(40,199,111,.12)}
.ans.good .k{color:var(--ok)}
.ans.bad{border-color:var(--warn);background:rgba(255,176,32,.1)}
.ans.bad .k{color:var(--warn)}
.exp{border-left:3px solid var(--red);background:#101014;padding:12px 14px;font-size:13px;line-height:1.75;color:#c9c9d2;margin-top:4px}
.exp b{color:var(--ok)}
.nav{display:flex;gap:8px;margin-top:14px}
.nav button{flex:1;border:1px solid var(--line);background:#101014;color:var(--txt);padding:13px;
  font-family:"Chakra Petch","Noto Sans TC";font-size:14px;cursor:pointer}
.nav button.main{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.nav button:disabled{opacity:.3}

/* ---- result ---- */
.score{text-align:center;padding:6px 0 2px}
.score .n{font-family:"Chakra Petch";font-size:60px;font-weight:700;line-height:1;color:var(--red)}
.score .n small{font-size:20px;color:var(--dim)}
.score .t{font-size:13px;color:var(--dim);letter-spacing:2px;margin-top:6px}
.stat{display:flex;justify-content:space-between;font-size:13px;padding:9px 0;border-bottom:1px dashed var(--line)}
.stat b{font-family:"Chakra Petch"}
.rev{border:1px solid var(--line);background:#101014;padding:12px;margin-bottom:8px;font-size:13px;line-height:1.65}
.rev .no{font-family:"Chakra Petch";color:var(--warn);font-weight:700;margin-right:6px}
.rev .ln{margin-top:6px;font-size:12px;color:var(--dim)}
.rev .ln em{color:var(--ok);font-style:normal}
.hidden{display:none}
.foot{text-align:center;color:#44444e;font-size:10px;letter-spacing:2px;margin-top:22px}
</style>
</head>
<body>
<div class="wrap">

  <div class="hd"><div class="hd-in">
    <div class="tt">iPAS <span>AI 應用規劃師</span> 刷題室</div>
    <div class="sub mono">WINZ TRAINING TERMINAL</div>
    <div class="chips">
      <div class="chip">距 8/15 剩 <b id="cDay">-</b> 天</div>
      <div class="chip">題庫 <b id="cBank">0</b> 題</div>
      <div class="chip g">錯題本 <b id="cWrong">0</b></div>
      <div class="chip">累計 <b id="cTotal">0</b> 題</div>
    </div>
  </div></div>

  <!-- ============ 首頁 ============ -->
  <div id="home">
    <div class="card">
      <div class="lbl">出題數量</div>
      <div class="grid" id="numSel">
        <div class="opt on" data-n="20">20 題<small>快速刷</small></div>
        <div class="opt" data-n="50">50 題<small>模擬考</small></div>
        <div class="opt" data-n="10">10 題<small>零碎時間</small></div>
        <div class="opt" data-n="999">全部<small>地毯式</small></div>
      </div>

      <div class="lbl" style="margin-top:18px">題目範圍</div>
      <div class="grid" id="catSel"></div>

      <div class="lbl" style="margin-top:18px">作答模式</div>
      <div class="grid" id="modeSel">
        <div class="opt on" data-m="1">即時解析<small>選完馬上對答案</small></div>
        <div class="opt" data-m="0">考試模式<small>交卷後才檢討</small></div>
      </div>

      <button class="btn" onclick="start()"><span>開始作答 ▸</span></button>
      <button class="btn ghost sm" onclick="startWrong()"><span>只練錯題本</span></button>
    </div>

    <div class="card" id="histCard">
      <div class="lbl">最近紀錄</div>
      <div id="histList" style="font-size:13px;color:var(--dim)">還沒有紀錄，開始第一輪吧。</div>
    </div>
  </div>

  <!-- ============ 作答 ============ -->
  <div id="quiz" class="hidden">
    <div class="card">
      <div class="bar" id="bar"></div>
      <div class="qmeta">
        <div class="mono">Q <span id="qNo">1</span> / <span id="qAll">20</span></div>
        <div class="cat" id="qCat">分類</div>
      </div>
      <div class="q" id="qText"></div>
      <div id="qOpts"></div>
      <div id="qExp" class="hidden"></div>
      <div class="nav">
        <button onclick="go(-1)" id="bPrev">◂ 上一題</button>
        <button onclick="go(1)" id="bNext">下一題 ▸</button>
      </div>
      <button class="btn ghost sm" onclick="submitAll()"><span>交卷看成績</span></button>
    </div>
  </div>

  <!-- ============ 成績 ============ -->
  <div id="result" class="hidden">
    <div class="card">
      <div class="score">
        <div class="n"><span id="rScore">0</span><small>分</small></div>
        <div class="t mono" id="rTxt">RESULT</div>
      </div>
      <div style="margin-top:14px">
        <div class="stat"><span>答對 / 總題數</span><b id="rHit">0 / 0</b></div>
        <div class="stat"><span>本次新增錯題</span><b id="rNew">0</b></div>
        <div class="stat"><span>錯題本累計</span><b id="rBook">0</b></div>
      </div>
      <div class="lbl" style="margin-top:18px">分類正確率</div>
      <div id="rCat"></div>
      <div class="row">
        <button class="btn sm" onclick="again()"><span>換一批再來</span></button>
        <button class="btn ghost sm" onclick="home()"><span>回首頁</span></button>
      </div>
    </div>
    <div class="card" id="reviewCard">
      <div class="lbl">錯題檢討</div>
      <div id="rList"></div>
    </div>
  </div>

  <div class="foot mono">WINZ · KEEP GRINDING · 8/15</div>
</div>

<script>
/* ================= 題庫 ================= */
const BANK = [
/* 概論 */
{c:"AI概論",q:"1956 年舉辦、被視為「人工智慧」一詞正式誕生的會議是？",o:["達特茅斯會議 (Dartmouth)","布列頓森林會議","日內瓦會議","圖靈紀念會"],a:0,e:"1956 年 John McCarthy 等人在達特茅斯學院提出 Artificial Intelligence 一詞，公認為 AI 元年。"},
{c:"AI概論",q:"AI、機器學習 (ML)、深度學習 (DL) 三者的範圍關係為何？",o:["AI ⊂ ML ⊂ DL","DL ⊂ ML ⊂ AI","ML ⊂ AI ⊂ DL","三者互不隸屬"],a:1,e:"AI 最大，機器學習是 AI 的一種手段，深度學習又是機器學習的一個分支。"},
{c:"AI概論",q:"圖靈測試 (Turing Test) 主要用來判斷什麼？",o:["機器運算速度是否超越人類","機器表現能否讓人分辨不出是人或機器","機器是否具有自我意識","機器耗電效率"],a:1,e:"圖靈測試看的是「行為表現」是否與人無異，不涉及意識。"},
{c:"AI概論",q:"目前實際落地的 AI（語音助理、影像辨識等）多屬於？",o:["強 AI（通用人工智慧）","弱 AI（狹義人工智慧）","超人工智慧","人工生命"],a:1,e:"弱 AI 只在特定任務上表現優異，無法跨領域通用。"},
{c:"AI概論",q:"早期專家系統 (Expert System) 的兩大核心組成是？",o:["知識庫與推論引擎","卷積層與池化層","生成器與判別器","編碼器與解碼器"],a:0,e:"專家系統＝知識庫（規則）＋推論引擎（依規則推導結論）。"},
{c:"AI概論",q:"推動本波 AI 浪潮的三大關鍵要素通常指？",o:["資料、演算法、算力","雲端、區塊鏈、物聯網","人才、資金、政策","感測器、馬達、控制器"],a:0,e:"大量資料 + 演算法突破 + GPU 算力，缺一不可。"},
{c:"AI概論",q:"要在照片中框出所有車輛的位置並標出類別，屬於哪項視覺任務？",o:["影像分類","物件偵測","語意分割","影像生成"],a:1,e:"分類只回答「是什麼」；偵測要回答「在哪裡＋是什麼」（畫框）。"},
{c:"AI概論",q:"將影像中每一個像素都標上所屬類別，稱為？",o:["物件偵測","語意分割","風格轉換","超解析度"],a:1,e:"語意分割是像素級的分類，精度高於畫框的物件偵測。"},
{c:"AI概論",q:"命名實體辨識 (NER) 的目的是？",o:["翻譯文章","辨識文本中的人名、地名、組織等實體","計算文章字數","將語音轉成文字"],a:1,e:"NER 屬 NLP 基礎任務，常用於資訊萃取與知識圖譜建構。"},
{c:"AI概論",q:"傳統 RPA（機器人流程自動化）最主要的特性是？",o:["依既定規則自動執行重複性流程","能自行學習並預測未知資料","具備自然語言理解能力","可自動生成程式碼"],a:0,e:"傳統 RPA 是規則式自動化，不會自我學習；結合 AI 後才稱為 IPA。"},
{c:"AI概論",q:"將 AI 模型部署在終端裝置（Edge AI）的主要優點是？",o:["模型可以無限大","降低延遲並減少資料外傳風險","不需任何運算資源","一定比雲端準確"],a:1,e:"邊緣運算就地推論，低延遲、省頻寬、資料不出廠，但算力受限。"},
{c:"AI概論",q:"「買了這項商品的人也買了…」最常使用的技術是？",o:["協同過濾","邊緣偵測","語音合成","主成分分析"],a:0,e:"協同過濾利用使用者或商品間的相似行為做推薦。"},
{c:"AI概論",q:"歷史上「AI 寒冬」發生的主要原因是？",o:["硬體太便宜","期望過高但成果與投入不成比例，資金退場","資料量太多無法處理","法規全面禁止"],a:1,e:"過度承諾 → 成果不如預期 → 補助與投資中斷，形成寒冬。"},
{c:"AI概論",q:"下列何者「最不適合」導入機器學習來解決？",o:["信用卡盜刷偵測","商品需求量預測","依固定稅率級距計算應扣所得稅","客服對話意圖分類"],a:2,e:"規則明確、可完全用公式表達的問題，用程式邏輯即可，導入 ML 反而多餘。"},
{c:"AI概論",q:"深度學習大量採用 GPU 的主因是？",o:["GPU 擅長大量平行的矩陣運算","GPU 儲存空間較大","GPU 不需散熱","GPU 只支援整數運算"],a:0,e:"神經網路本質是大量矩陣乘法，GPU 的平行核心正好適合。"},

/* 機器學習 */
{c:"機器學習",q:"訓練資料同時包含輸入特徵與正確答案（標籤）的學習方式稱為？",o:["監督式學習","非監督式學習","強化學習","遷移學習"],a:0,e:"有標準答案可對照＝監督式；分類與迴歸都屬於此類。"},
{c:"機器學習",q:"K-means 分群屬於下列何種學習？",o:["監督式","非監督式","強化式","半監督式"],a:1,e:"分群不需要標籤，是從資料本身結構找群體，屬非監督式。"},
{c:"機器學習",q:"透過與環境互動、依獎勵訊號調整策略的學習方式是？",o:["監督式學習","非監督式學習","強化學習","集成學習"],a:2,e:"強化學習四要素：代理人、環境、行動、獎勵。"},
{c:"機器學習",q:"預測明天的氣溫（連續數值）屬於哪類問題？",o:["分類","迴歸","分群","降維"],a:1,e:"輸出連續值＝迴歸；輸出類別＝分類。"},
{c:"機器學習",q:"決策樹常用來選擇分裂節點的指標是？",o:["吉尼不純度 (Gini) 或資訊增益","AUC","曼哈頓距離","學習率"],a:0,e:"CART 用 Gini、ID3/C4.5 用資訊增益，目標都是讓分裂後子節點更純。"},
{c:"機器學習",q:"隨機森林 (Random Forest) 屬於哪一種集成策略？",o:["Bagging","Boosting","Stacking","不屬於集成"],a:0,e:"隨機森林以自助抽樣建多棵樹平行訓練再投票，是典型 Bagging。"},
{c:"機器學習",q:"XGBoost、LightGBM 主要採用的集成方式是？",o:["Bagging","Boosting","分群","降維"],a:1,e:"Boosting 序列式訓練，每一輪針對前一輪的殘差／錯誤加強修正。"},
{c:"機器學習",q:"關於 Bagging 與 Boosting 的差異，何者正確？",o:["Bagging 可平行訓練；Boosting 為序列式逐步修正前一輪錯誤","兩者皆必須序列訓練","Boosting 只能用於非監督式","Bagging 一定比 Boosting 準確"],a:0,e:"Bagging 降變異、Boosting 降偏差，各有適用場景。"},
{c:"機器學習",q:"支援向量機 (SVM) 的核心概念是？",o:["尋找使類別間間隔 (margin) 最大的分隔超平面","以多數決投票分類","模擬人腦神經元","計算條件機率"],a:0,e:"最大化 margin 可提升泛化能力；非線性問題靠核函數 (Kernel) 映射。"},
{c:"機器學習",q:"關於 KNN 演算法，何者正確？",o:["屬惰性學習，預測時才計算距離，且對特徵尺度敏感","訓練久但預測極快","不需設定任何超參數","無法用於分類"],a:0,e:"KNN 沒有真正的訓練過程，K 值與距離度量是關鍵超參數，使用前務必做特徵縮放。"},
{c:"機器學習",q:"Naive Bayes 之所以稱為「樸素」，是因為它假設？",o:["所有特徵彼此條件獨立","資料必為常態分佈","樣本數必須很大","類別數只能為二"],a:0,e:"條件獨立假設現實中常不成立，但在文字分類上效果仍相當好。"},
{c:"機器學習",q:"Logistic Regression 主要用於？",o:["分類問題，透過 Sigmoid 輸出 0~1 的機率","只能做連續值預測","資料降維","影像壓縮"],a:0,e:"名字有 regression，但實際是分類演算法。"},
{c:"機器學習",q:"模型在訓練集表現極佳、測試集卻明顯變差，稱為？",o:["欠擬合","過擬合","資料不平衡","梯度爆炸"],a:1,e:"過擬合＝把雜訊也記住了，泛化能力差。"},
{c:"機器學習",q:"下列何者「無助於」改善過擬合？",o:["增加訓練資料","加入 L1/L2 正則化","使用 Dropout 或提早停止","持續加大模型參數量並延長訓練"],a:3,e:"模型越複雜、訓練越久，越容易記住訓練集的雜訊，過擬合更嚴重。"},
{c:"機器學習",q:"欠擬合 (Underfitting) 通常代表？",o:["模型過於簡單，訓練集與測試集表現都差","模型記住了雜訊","資料量過多","學習率為零"],a:0,e:"欠擬合要增加模型複雜度、加特徵或延長訓練。"},

{c:"機器學習",q:"購物籃分析中「支持度 (Support)」代表？",o:["該組合在所有交易中出現的比例","買 A 後買 B 的條件機率","規則的提升倍數","資料的變異程度"],a:0,e:"支持度看普遍性、信賴度看條件機率、提升度看是否真的相關。"},
{c:"機器學習",q:"關聯規則中，提升度 (Lift) 大於 1 代表？",o:["A 與 B 的出現具正相關，捆綁推薦有意義","兩者完全獨立","B 會抑制 A","規則無效"],a:0,e:"Lift = 1 表獨立、< 1 表負相關。"},
{c:"機器學習",q:"設備感測資料中找出少數異常樣本，適合採用？",o:["Isolation Forest 或 One-Class SVM 等異常偵測法","線性迴歸","關聯規則","One-hot 編碼"],a:0,e:"異常樣本稀少且常無標籤，多以非監督式異常偵測處理。"},
{c:"機器學習",q:"ARIMA 模型主要用於？",o:["時間序列預測","影像分割","文字生成","分群"],a:0,e:"ARIMA 由自迴歸、差分、移動平均組成，需先檢查序列是否平穩。"},
{c:"機器學習",q:"「超參數」與「參數」的差別是？",o:["超參數由人事先設定；參數由訓練過程學習得到","兩者相同","超參數由模型自動學習","參數必須手動填寫"],a:0,e:"如學習率、樹深度是超參數；神經網路權重是參數。"},
{c:"機器學習",q:"Grid Search 與 Random Search 的用途是？",o:["搜尋最佳超參數組合","清理遺漏值","切分資料","繪製圖表"],a:0,e:"搜尋空間大時，隨機搜尋或貝氏最佳化通常比網格搜尋更有效率。"},
{c:"機器學習",q:"L1 正則化（Lasso）相較 L2 的特色是？",o:["會將部分係數壓縮為 0，具特徵選擇效果","一定使模型更複雜","只能用於分群","不影響係數"],a:0,e:"L1 產生稀疏解、L2（Ridge）則讓係數平滑縮小但不歸零。"},
{c:"機器學習",q:"Stacking（堆疊）集成的做法是？",o:["以多個基模型的預測結果作為輸入，再訓練一個上層模型整合","隨機抽樣建多棵樹","逐輪修正殘差","刪除表現差的特徵"],a:0,e:"Stacking 常能再壓榨出一點成績，但複雜度與過擬合風險上升。"},
{c:"機器學習",q:"「學歷：高中／大學／碩士」這類有順序的類別，較適合使用？",o:["序數編碼（Ordinal Encoding）","One-hot 且必須丟棄順序","對數轉換","主成分分析"],a:0,e:"有序類別保留大小關係有助模型學習；無序類別才用 One-hot。"},
{c:"機器學習",q:"階層式分群 (Hierarchical Clustering) 的特色是？",o:["可繪出樹狀圖並事後決定切分群數","必須事先指定 K 值","只能處理影像","需要標籤"],a:0,e:"樹狀圖 (Dendrogram) 讓分析者依需求選擇切割高度。"},
{c:"機器學習",q:"DBSCAN 相較 K-means 的優勢是？",o:["能找出任意形狀的群並自動辨識雜訊點","一定比較快","不需任何參數","只能分兩群"],a:0,e:"DBSCAN 以密度定義群集，但對參數 eps 與 MinPts 敏感。"},
{c:"機器學習",q:"提早停止 (Early Stopping) 的判斷依據通常是？",o:["驗證集損失不再下降時停止訓練","訓練集損失降到 0","跑滿固定輪數","記憶體用盡"],a:0,e:"驗證損失回升即為過擬合開始的訊號。"},
{c:"機器學習",q:"類別極度不平衡時，切分訓練／測試集應採用？",o:["分層抽樣 (Stratified Split) 維持各集類別比例","完全隨機切分即可","把少數類全放測試集","不需切分"],a:0,e:"否則測試集可能一筆少數類都沒有，評估完全失真。"},
{c:"機器學習",q:"從學習曲線看到「訓練與驗證分數都低且接近」，通常代表？",o:["欠擬合，應提高模型複雜度或加特徵","過擬合，應加正則化","資料洩漏","標籤錯誤"],a:0,e:"若訓練高、驗證低且落差大，才是過擬合。"},
{c:"機器學習",q:"決策樹相較神經網路最明顯的優點是？",o:["決策路徑可視覺化，解釋性高","準確率一定較高","訓練不需資料","可處理影像像素"],a:0,e:"在需向主管或稽核說明決策理由的場景，樹模型常更受青睞。"},
{c:"機器學習",q:"多元線性迴歸中，自變數之間高度相關會造成？",o:["多重共線性，使係數不穩定且難以解釋","模型必定過擬合","無法計算 R²","資料自動遺失"],a:0,e:"可用 VIF 檢測，並以移除變數、合併或改用 Ridge 處理。"},
{c:"機器學習",q:"特徵選擇方法中，Filter 法的特色是？",o:["先以統計指標篩選特徵，與後續模型無關，計算快","必須訓練模型才能評估","嵌在模型訓練過程中","一定最準確"],a:0,e:"Wrapper 法用模型效能反覆評估較準但慢；Embedded 法如 Lasso 邊訓練邊選。"},
{c:"機器學習",q:"AutoML 的主要價值是？",o:["自動化特徵處理、演算法選擇與調參，降低建模門檻","完全不需要資料","保證模型永不失效","取代商業需求分析"],a:0,e:"AutoML 加速前期試錯，但商業理解與資料品質仍須人負責。"},

{c:"深度學習",q:"若將神經網路所有權重初始化為相同的值，會造成？",o:["各神經元學到相同特徵，失去表達能力","訓練速度加倍","自動正則化","梯度必為 0 以外皆正常"],a:0,e:"需以隨機初始化（如 He、Xavier）打破對稱性。"},

{c:"深度學習",q:"BERT 與 GPT 的主要架構差異是？",o:["BERT 採雙向編碼器偏理解任務；GPT 採單向解碼器偏生成任務","兩者完全相同","BERT 只能處理影像","GPT 不使用 Transformer"],a:0,e:"BERT 適合分類、NER 等理解任務；GPT 適合文本生成。"},

{c:"深度學習",q:"訓練損失持續下降但驗證損失開始上升，代表？",o:["開始過擬合，應考慮提早停止或加強正則化","模型仍在正常學習","學習率太小","資料不足以外無其他可能"],a:0,e:"這是最典型的過擬合訊號。"},
{c:"深度學習",q:"深度學習相較傳統機器學習的重要特點是？",o:["能自動從原始資料中學習特徵表示","一定不需要資料","可完全解釋每個決策","訓練成本較低"],a:0,e:"代價是需要更多資料、更多算力，且可解釋性較差。"},
{c:"深度學習",q:"影像輸入 CNN 前常做的正規化是？",o:["將像素值縮放到 0~1 或標準化","轉成文字","做 One-hot 編碼","刪除色彩通道"],a:0,e:"統一數值範圍有助梯度穩定與收斂。"},

{c:"資料處理",q:"資料呈嚴重右偏（如所得、交易金額）時，常見的轉換方式是？",o:["對數轉換","開三次方必用","One-hot 編碼","刪除全部大值"],a:0,e:"取對數可壓縮極端值、使分佈接近常態，有利線性模型。"},
{c:"資料處理",q:"評估多位標註人員標註結果一致性的常用指標是？",o:["Cohen's Kappa","RMSE","AUC","IQR"],a:0,e:"標註一致性低通常代表標註規範不清，需先修訂 SOP 再重標。"},
{c:"資料處理",q:"只用官網會員資料訓練模型卻推論到全體消費者，可能造成？",o:["抽樣偏誤，模型在未涵蓋族群上表現不佳","資料量過大","梯度爆炸","標籤外洩"],a:0,e:"訓練資料的代表性決定模型的適用邊界。"},
{c:"資料處理",q:"Parquet 相較 CSV 的主要優勢是？",o:["欄式儲存、壓縮率高、大量分析查詢效率佳","可用記事本直接編輯","一定檔案較大","不需 schema"],a:0,e:"CSV 通用但無型別資訊；Parquet 適合資料湖與大數據分析。"},
{c:"資料處理",q:"以 API 串接取得外部資料時，最應注意的是？",o:["授權範圍、流量限制與資料使用條款","伺服器顏色","檔名長度","螢幕解析度"],a:0,e:"超出 Rate Limit 或違反條款可能導致服務中斷或法律風險。"},
{c:"資料處理",q:"使用網路爬蟲蒐集資料時，下列何者最應留意？",o:["網站服務條款、robots.txt 與著作權／個資規範","爬蟲程式的變數命名","伺服器機殼材質","瀏覽器主題色"],a:0,e:"技術可行不等於法律可行，商業使用尤須審慎評估。"},
{c:"資料處理",q:"資料遮罩 (Data Masking) 的典型做法是？",o:["將身分證號顯示為 A12****789 之類的部分遮蔽","刪除整張資料表","加大字型","轉成圖片"],a:0,e:"常用於測試環境與跨部門分享，降低個資曝險。"},
{c:"資料處理",q:"備份的 3-2-1 原則是指？",o:["3 份副本、2 種媒體、1 份異地","3 天備份 1 次","3 位管理員","3 種格式"],a:0,e:"AI 專案的資料集與模型檔同樣需要納入備份策略。"},
{c:"資料處理",q:"特徵商店 (Feature Store) 的價值是？",o:["集中管理與重複使用特徵，確保訓練與線上推論口徑一致","儲存模型權重","販售資料","管理員工帳號"],a:0,e:"可避免離線訓練與線上服務特徵計算方式不同造成的落差。"},
{c:"資料處理",q:"對 AI 專案而言，資料版本控管的重要性在於？",o:["確保實驗可重現，能追溯是哪份資料訓練出哪個模型","節省硬碟空間","加快網路速度","美化報表"],a:0,e:"模型、程式碼、資料三者版本齊備，才談得上可重現與可稽核。"},
{c:"資料處理",q:"時間序列資料出現遺漏時，較不適當的處理是？",o:["用未來時點的值回填過去（造成資料洩漏）","前值填補","線性內插","以季節性平均填補"],a:0,e:"時間序列絕不能使用未來資訊，否則回測結果會嚴重高估。"},
{c:"資料處理",q:"下列何者屬於資料品質的評估面向？",o:["完整性、正確性、一致性、及時性","解析度、色深、對比","CPU、RAM、硬碟","長度、寬度、高度"],a:0,e:"另常加上唯一性與有效性，合稱資料品質構面。"},

/* 統計分析 */
{c:"統計分析",q:"描述「最常出現的類別」應使用哪個統計量？",o:["眾數","平均數","中位數","標準差"],a:0,e:"類別型資料無法計算平均數，眾數是合適選擇。"},
{c:"統計分析",q:"四分位距 (IQR) 的定義是？",o:["Q3 - Q1","最大值 - 最小值","平均數 - 中位數","標準差的平方"],a:0,e:"IQR 代表中間 50% 資料的分佈範圍，不受極端值影響。"},
{c:"統計分析",q:"資料呈右偏（正偏）分佈時，通常？",o:["平均數 > 中位數","平均數 < 中位數","兩者必相等","無法比較"],a:0,e:"右側長尾把平均數往上拉，例如所得分佈。"},
{c:"統計分析",q:"95% 信賴區間的正確理解是？",o:["以相同方法重複抽樣，約 95% 的區間會涵蓋母體真值","母體參數有 95% 機率是隨機值","樣本一定正確","誤差率為 5% 的預測"],a:0,e:"信賴水準描述的是「方法的長期表現」，不是單一區間的機率。"},
{c:"統計分析",q:"假設檢定中，型一錯誤 (Type I Error) 是指？",o:["虛無假設為真卻被拒絕（誤報）","虛無假設為假卻未被拒絕","樣本數不足","計算錯誤"],a:0,e:"型二錯誤則是該拒絕卻沒拒絕（漏報），兩者需權衡。"},
{c:"統計分析",q:"A/B 測試的核心精神是？",o:["以隨機分組比較，確認差異來自方案而非其他因素","同時上線所有方案","只看總營收成長","由主管決定勝出方案"],a:0,e:"隨機分派可控制干擾因素，是驗證因果的實用方法。"},
{c:"統計分析",q:"要檢定「性別」與「是否購買」兩個類別變數是否相關，應使用？",o:["卡方檢定","t 檢定","ANOVA","線性迴歸"],a:0,e:"卡方獨立性檢定專門處理類別變數之間的關聯。"},
{c:"統計分析",q:"比較兩組樣本的平均數是否有顯著差異，常用？",o:["t 檢定","卡方檢定","主成分分析","關聯規則"],a:0,e:"三組以上比較平均數則用變異數分析 (ANOVA)。"},
{c:"統計分析",q:"Z 分數（標準分數）的意義是？",o:["某觀測值距離平均數幾個標準差","資料的總和","資料筆數","出現機率"],a:0,e:"常以 |Z| > 3 作為離群值的判斷參考。"},
{c:"統計分析",q:"其他條件相同下，樣本數增加通常會使？",o:["估計更精確、信賴區間變窄","誤差變大","平均數必定上升","變異數必為 0"],a:0,e:"但樣本再大也無法修正抽樣方法本身的偏誤。"},

/* 模型評估 */
{c:"模型評估",q:"特異度 (Specificity) 的定義是？",o:["實際為陰性中被正確判為陰性的比例","實際陽性中被找出的比例","預測陽性中正確的比例","整體正確率"],a:0,e:"Specificity = TN / (TN + FP)，與 Recall（敏感度）互為對照。"},
{c:"模型評估",q:"某模型 TP=40、FP=10、FN=20、TN=130，其整體準確率為？",o:["85%","80%","67%","95%"],a:0,e:"(40+130) / 200 = 85%。"},
{c:"模型評估",q:"在極度不平衡的資料上，比 ROC 曲線更具鑑別力的通常是？",o:["PR 曲線（Precision-Recall）","學習曲線","殘差圖","箱型圖"],a:0,e:"大量真陰性會讓 ROC 看起來過於樂觀，PR 曲線更聚焦少數類。"},
{c:"模型評估",q:"MAPE 指標的特性是？",o:["以百分比表示預測誤差，便於跨產品比較，但實際值接近 0 時會失真","只能用於分類","值域固定 0~1","與單位無關且永不失效"],a:0,e:"需求預測常用 MAPE，但低銷量品項的 MAPE 容易爆高。"},
{c:"模型評估",q:"建立模型前先設定「基準模型 (Baseline)」的目的是？",o:["提供比較基準，確認複雜模型是否真的帶來提升","滿足文件需求","增加專案時程","取代最終模型"],a:0,e:"基準可以是規則法、歷史平均或最頻繁類別。"},
{c:"模型評估",q:"模型離線指標很好但上線後業務成效不如預期，最可能的原因是？",o:["離線指標與實際業務目標未對齊，或線上資料分佈不同","GPU 不夠","程式語言選錯","報表顏色不佳"],a:0,e:"應同步追蹤業務 KPI（轉換率、漏檢率、成本節省），並做線上 A/B 驗證。"},
{c:"模型評估",q:"分層 K 折交叉驗證 (Stratified K-Fold) 的特點是？",o:["每一折都維持與原資料相近的類別比例","只切一折","不需要標籤","僅用於迴歸"],a:0,e:"分類任務尤其是不平衡資料，應優先採用分層版本。"},
{c:"模型評估",q:"以「盜刷偵測」為例，提高 Recall 的實務代價通常是？",o:["誤報增加，客服與人工複核成本上升","模型無法訓練","資料量減少","完全沒有代價"],a:0,e:"閾值選擇本質是業務成本的取捨，需與業務單位共同決定。"},

/* 導入管理 */
{c:"導入管理",q:"AI 專案成功最關鍵的組織因素通常是？",o:["高階主管支持與跨部門協作","購買最新顯示卡","團隊人數最多","辦公室位置"],a:0,e:"AI 專案往往牽動流程與權責，缺乏高層支持極易停在 POC。"},
{c:"導入管理",q:"導入 AI 後第一線人員抗拒使用，較合適的處理方式是？",o:["納入使用者共同設計流程、說明效益並提供訓練與過渡期","強制執行不予說明","直接下架系統","更換全部人員"],a:0,e:"變革管理與使用者接受度往往比模型準確率更決定成敗。"},
{c:"導入管理",q:"評估 AI 專案 ROI 時，效益面應包含？",o:["人力節省、錯誤率下降、週期縮短等可量化成果","僅計算模型準確率","僅計算硬體成本","僅看競爭對手是否也做"],a:0,e:"成本面則需含資料整備、開發、授權與長期維運。"},
{c:"導入管理",q:"將資料標註外包時，最應注意的風險是？",o:["個資與營業秘密外洩，以及標註品質不穩","標註人員的學歷","外包商所在樓層","合約字型"],a:0,e:"應簽保密協定、資料去識別化，並建立抽檢與驗收機制。"},
{c:"導入管理",q:"採用外部 AI SaaS 服務相較自建的主要優點是？",o:["上線快、初期投入低，可先驗證價值","資料一定更安全","長期一定更便宜","完全客製化"],a:0,e:"缺點是資料需外送、客製受限，且有供應商鎖定風險。"},
{c:"導入管理",q:"POC 通過後，通常的下一步是？",o:["小範圍試點 (Pilot) 驗證真實環境成效","立即全公司上線","結案不再推進","重新開始需求訪談"],a:0,e:"POC 驗技術、Pilot 驗流程與人，最後才全面推廣。"},
{c:"導入管理",q:"為 AI 專案設定 KPI 時，較合適的是？",o:["對應商業目標，如漏檢率降低 X%、處理工時減少 Y 小時","模型參數量","程式碼行數","會議次數"],a:0,e:"純技術指標無法向管理層證明價值。"},
{c:"導入管理",q:"需求訪談時，AI 規劃師最該釐清的是？",o:["現行流程痛點、決策依據、資料從何而來與誰負責","使用者的喜好顏色","伺服器品牌","公司歷史沿革"],a:0,e:"問清楚「這個判斷現在是誰、依據什麼做的」，常能直接定義出模型的輸入與輸出。"},
{c:"導入管理",q:"AI 專案常見的失敗原因，下列何者最典型？",o:["題目與商業價值脫節、資料品質不足、缺乏維運規劃","演算法不夠新","沒有使用最貴的雲端服務","簡報做得不夠精美"],a:0,e:"多數失敗發生在資料與需求端，而非模型技術本身。"},
{c:"導入管理",q:"AI 團隊中，資料工程師的主要職責是？",o:["建置資料管線、確保資料可取得且品質穩定","負責業務銷售","設計行銷素材","撰寫法律契約"],a:0,e:"資料科學家負責建模、MLOps 負責部署與監控，角色互補。"},
{c:"導入管理",q:"新模型上線時採「灰度發布」的用意是？",o:["先導流少量流量觀察成效與異常，再逐步放大","一次全量切換以節省時間","僅在測試環境執行","關閉所有監控"],a:0,e:"可搭配自動回滾機制，降低上線風險。"},
{c:"導入管理",q:"AI 系統上線後仍需編列預算的主因是？",o:["需持續監控、重新訓練與維護資料管線","硬體必須每月更換","要付專利費給演算法作者","法規要求每月改版"],a:0,e:"AI 是持續營運的服務，不是一次性專案。"},
{c:"導入管理",q:"專案範疇不斷擴張、需求持續增加的現象稱為？",o:["範疇蔓延 (Scope Creep)","資料漂移","過擬合","技術債"],a:0,e:"應以明確的驗收標準與變更管理流程控制。"},
{c:"導入管理",q:"評選 AI 供應商時，除價格外最應納入考量的是？",o:["資料處理方式、資安與法遵、可維護性與退場機制","公司成立年份是否吉利","業務窗口口才","官網設計"],a:0,e:"退場（資料與模型可攜性）常被忽略，卻是鎖定風險的關鍵。"},
{c:"導入管理",q:"為 AI 應用建立標準作業程序 (SOP) 的價值在於？",o:["明訂人機分工與異常處理，讓成效不依賴個別人員","增加文件數量","滿足稽核形式","降低模型準確率"],a:0,e:"特別是模型判定不確定時的人工介入規則，必須事先寫清楚。"},

/* 倫理法規 */
{c:"倫理法規",q:"GDPR 中的「被遺忘權」是指？",o:["當事人得請求刪除其個人資料","企業可永久保存資料","資料可自由跨境傳輸","可拒絕提供服務"],a:0,e:"若個資已用於模型訓練，刪除的落實方式在實務上仍是難題。"},
{c:"倫理法規",q:"我國個資法所稱的「特種個資」不包含下列何者？",o:["公司職稱","病歷與健康檢查","基因資料","犯罪前科"],a:0,e:"特種個資原則上不得蒐集處理利用，除非符合法定例外要件。"},
{c:"倫理法規",q:"「資料最小化」原則的意思是？",o:["只蒐集達成特定目的所必要的資料","盡可能多蒐集以備不時之需","資料檔案要壓縮","只保留一份備份"],a:0,e:"蒐集越多、風險與保管責任越大。"},
{c:"倫理法規",q:"深偽 (Deepfake) 技術帶來的主要風險是？",o:["偽造影音進行詐騙、名譽侵害與假訊息傳播","佔用過多硬碟","降低網路速度","增加電費"],a:0,e:"因應方向包含偵測技術、內容來源標示與法規規範。"},
{c:"倫理法規",q:"對使用者揭露「您正在與 AI 對話」，主要體現哪項倫理原則？",o:["透明性","效率性","經濟性","擴充性"],a:0,e:"多國法規已要求 AI 互動與 AI 生成內容須明確標示。"},
{c:"倫理法規",q:"評估模型公平性時，常見的做法是？",o:["比較不同族群間的通過率或錯誤率是否存在顯著差距","只看整體準確率","刪除所有欄位","增加模型層數"],a:0,e:"注意：僅移除敏感欄位並不足夠，其他特徵可能成為代理變數。"},
{c:"倫理法規",q:"企業將含個資的資料傳送至境外雲端進行訓練，應優先確認？",o:["跨境傳輸的法規限制與當事人告知同意","雲端介面是否美觀","時區差異","匯率變動"],a:0,e:"部分主管機關對特定產業的跨境傳輸有明文限制。"},
{c:"倫理法規",q:"個人資料的保存期限原則上應如何處理？",o:["達成特定目的後即應刪除或停止處理利用","永久保存以備查","保存至公司解散","由員工自行決定"],a:0,e:"應訂定保存年限與定期清理機制，並留下處理紀錄。"},
{c:"倫理法規",q:"員工以生成式 AI 產出的程式碼直接商用，主要法律風險是？",o:["可能混入受特定授權限制的程式碼，衍生授權與侵權疑慮","程式一定跑不動","無法版本控管","必須公開原始碼給客戶"],a:0,e:"應建立程式碼來源檢查與授權掃描機制。"},

/* ================= 狀態 ================= */
const EXAM = new Date(2026,7,15);
let wrongBook = [], history = [], totalDone = 0;
let cfg = {n:20, cat:"ALL", instant:true};
let S = null;

/* -------- 儲存 -------- */
async function load(){
  try{
    const r = await window.storage.get("ipas:data");
    if(r && r.value){const d = JSON.parse(r.value); wrongBook = d.w||[]; history = d.h||[]; totalDone = d.t||0;}
  }catch(e){}
  paint();
}
async function save(){
  try{ await window.storage.set("ipas:data", JSON.stringify({w:wrongBook,h:history,t:totalDone})); }catch(e){}
}

function paint(){
  const d = Math.ceil((EXAM - new Date())/864e5);
  document.getElementById("cDay").textContent = d>=0?d:0;
  document.getElementById("cBank").textContent = BANK.length;
  document.getElementById("cWrong").textContent = wrongBook.length;
  document.getElementById("cTotal").textContent = totalDone;
  const hl = document.getElementById("histList");
  if(history.length){
    hl.innerHTML = history.slice(-6).reverse().map(h=>
      `<div class="stat"><span>${h.d}　${h.c}</span><b style="color:${h.s>=70?'var(--ok)':'var(--warn)'}">${h.s} 分 (${h.k}/${h.n})</b></div>`).join("");
  }
}

/* -------- 首頁選項 -------- */
const cats = ["ALL", ...new Set(BANK.map(x=>x.c))];
document.getElementById("catSel").innerHTML = cats.map((c,i)=>{
  const n = c==="ALL"?BANK.length:BANK.filter(x=>x.c===c).length;
  return `<div class="opt ${i===0?'on':''}" data-c="${c}">${c==="ALL"?"全部範圍":c}<small>${n} 題</small></div>`;
}).join("");

function bindSel(id, key, cast){
  document.getElementById(id).addEventListener("click", e=>{
    const t = e.target.closest(".opt"); if(!t) return;
    [...t.parentNode.children].forEach(x=>x.classList.remove("on"));
    t.classList.add("on"); cfg[key] = cast(t.dataset[key==="n"?"n":key==="cat"?"c":"m"]);
  });
}
bindSel("numSel","n",v=>+v);
bindSel("catSel","cat",v=>v);
bindSel("modeSel","instant",v=>v==="1");

/* -------- 抽題 -------- */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

function build(pool, n){
  const pick = shuffle(pool.slice()).slice(0, Math.min(n, pool.length));
  return pick.map(id=>{
    const b = BANK[id];
    const opts = b.o.map((t,i)=>({t, ok:i===b.a}));
    shuffle(opts);
    return {id, q:b.q, c:b.c, e:b.e, opts, pick:null};
  });
}

function start(){
  const pool = BANK.map((b,i)=>i).filter(i=> cfg.cat==="ALL" || BANK[i].c===cfg.cat );
  launch(build(pool, cfg.n));
}
function startWrong(){
  if(!wrongBook.length){ alert("錯題本是空的，先做一輪吧。"); return; }
  launch(build(wrongBook.slice(), 999));
}
function again(){ start(); }

function launch(list){
  S = {list, i:0, submitted:false};
  show("quiz"); render();
  window.scrollTo(0,0);
}
function show(id){
  ["home","quiz","result"].forEach(x=>document.getElementById(x).classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
}
function home(){ show("home"); paint(); window.scrollTo(0,0); }

/* -------- 作答畫面 -------- */
function render(){
  const q = S.list[S.i];
  document.getElementById("qNo").textContent = S.i+1;
  document.getElementById("qAll").textContent = S.list.length;
  document.getElementById("qCat").textContent = q.c;
  document.getElementById("qText").textContent = q.q;

  const KEY = "ABCD";
  const done = q.pick!==null && (cfg.instant || S.submitted);
  document.getElementById("qOpts").innerHTML = q.opts.map((o,i)=>{
    let cls = "";
    if(done){ if(o.ok) cls="good"; else if(q.pick===i) cls="bad"; }
    else if(q.pick===i) cls="pick";
    return `<div class="ans ${cls}" onclick="pick(${i})"><div class="k">${KEY[i]}</div><div>${o.t}</div></div>`;
  }).join("");

  const ex = document.getElementById("qExp");
  if(done){ ex.className="exp"; ex.innerHTML = `<b>${q.opts[q.pick].ok?"✓ 答對":"✕ 答錯"}</b>　${q.e}`; }
  else ex.className = "hidden";

  document.getElementById("bPrev").disabled = S.i===0;
  document.getElementById("bNext").textContent = S.i===S.list.length-1 ? "交卷 ▸" : "下一題 ▸";
  document.getElementById("bNext").className = S.i===S.list.length-1 ? "main" : "";

  document.getElementById("bar").innerHTML = S.list.map((x,i)=>{
    let c="seg";
    if(x.pick!==null){ c += cfg.instant ? (x.opts[x.pick].ok?" right":" wrong") : " done"; }
    if(i===S.i) c="seg now";
    return `<div class="${c}"></div>`;
  }).join("");
}

function pick(i){
  const q = S.list[S.i];
  if(cfg.instant && q.pick!==null) return;
  q.pick = i; render();
  if(cfg.instant && S.i < S.list.length-1) setTimeout(()=>{ go(1); }, 1200);
}
function go(d){
  if(d>0 && S.i===S.list.length-1){ submitAll(); return; }
  S.i = Math.max(0, Math.min(S.list.length-1, S.i+d));
  render(); window.scrollTo(0,0);
}

/* -------- 交卷 -------- */
async function submitAll(){
  const un = S.list.filter(x=>x.pick===null).length;
  if(un && !confirm(`還有 ${un} 題未作答，確定交卷？`)) return;
  S.submitted = true;

  let hit=0, newWrong=0; const catStat={};
  S.list.forEach(q=>{
    const ok = q.pick!==null && q.opts[q.pick].ok;
    catStat[q.c] = catStat[q.c]||{k:0,n:0};
    catStat[q.c].n++; if(ok) catStat[q.c].k++;
    if(ok){ hit++; const p=wrongBook.indexOf(q.id); if(p>-1) wrongBook.splice(p,1); }
    else { if(!wrongBook.includes(q.id)){ wrongBook.push(q.id); newWrong++; } }
  });

  const score = Math.round(hit/S.list.length*100);
  totalDone += S.list.length;
  const dt = new Date(), d = `${dt.getMonth()+1}/${dt.getDate()}`;
  history.push({d, c:cfg.cat==="ALL"?"全範圍":cfg.cat, s:score, k:hit, n:S.list.length});
  if(history.length>30) history.shift();
  await save();

  document.getElementById("rScore").textContent = score;
  document.getElementById("rTxt").textContent = score>=90?"穩了，維持手感":score>=70?"及格線之上，繼續磨":score>=50?"還差一段，回頭補弱項":"從錯題本開始重練";
  document.getElementById("rHit").textContent = `${hit} / ${S.list.length}`;
  document.getElementById("rNew").textContent = newWrong;
  document.getElementById("rBook").textContent = wrongBook.length;
  document.getElementById("rCat").innerHTML = Object.entries(catStat).map(([c,v])=>{
    const p = Math.round(v.k/v.n*100);
    return `<div class="stat"><span>${c}</span><b style="color:${p>=70?'var(--ok)':'var(--warn)'}">${v.k}/${v.n}　${p}%</b></div>`;
  }).join("");

  const bad = S.list.filter(q=> !(q.pick!==null && q.opts[q.pick].ok) );
  document.getElementById("reviewCard").style.display = bad.length?"":"none";
  document.getElementById("rList").innerHTML = bad.map((q,i)=>{
    const right = q.opts.find(o=>o.ok).t;
    return `<div class="rev"><span class="no">${String(i+1).padStart(2,"0")}</span>${q.q}
      <div class="ln">你的答案：${q.pick===null?"未作答":q.opts[q.pick].t}</div>
      <div class="ln">正解：<em>${right}</em></div>
      <div class="ln">${q.e}</div></div>`;
  }).join("");

  show("result"); paint(); window.scrollTo(0,0);
}

document.addEventListener("keydown", e=>{
  if(document.getElementById("quiz").classList.contains("hidden")) return;
  if(e.key==="ArrowRight") go(1);
  if(e.key==="ArrowLeft") go(-1);
  if("1234".includes(e.key)) pick(+e.key-1);
});

load();
</script>
</body>
